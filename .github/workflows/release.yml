name: Release

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dombestein-data/payload-supabase-auth typecheck
      - run: pnpm --filter @dombestein-data/payload-supabase-auth test
      - run: pnpm --filter @dombestein-data/payload-supabase-auth build
      - run: pnpm --filter dev exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @dombestein-data/payload-supabase-auth exec npm pack --dry-run
      - uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
